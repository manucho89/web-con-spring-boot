<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestión de Usuarios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <header class="cabecera">
            <div class="cabecera-contenido">
                <div>
                    <p class="version">Spring Boot CRUD · v1.2.2</p>

                    <h1>Gestión de Usuarios</h1>

                    <p class="subtitulo">
                        Administra usuarios desde una interfaz moderna conectada con la API de Spring Boot.
                    </p>
                </div>

                <div class="estado-api" aria-label="Estado de la aplicación">
                    <span class="estado-api-punto"></span>
                    <span id="estado-api-texto">API: comprobando conexión...</span>
                </div>
            </div>
        </header>

        <section class="panel panel-formulario" aria-labelledby="titulo-nuevo-usuario">

            <div class="panel-cabecera">
                <div>
                    <p class="panel-etiqueta">Formulario</p>
                    <h2 id="titulo-nuevo-usuario">Nuevo usuario</h2>
                </div>
            </div>

            <form id="formulario-usuario" novalidate>

                <div class="formulario-grid">
                    <div class="campo">
                        <label for="nombre">Nombre</label>

                        <input
                            id="nombre"
                            name="nombre"
                            type="text"
                            placeholder="Escribe el nombre"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="email">Correo electrónico</label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="usuario@ejemplo.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <div class="formulario-acciones">
                    <button id="boton-guardar" type="submit">
                        Guardar usuario
                    </button>

                    <p
                        id="mensaje-formulario"
                        class="mensaje-formulario"
                        role="status"
                        aria-live="polite"
                    ></p>
                </div>

            </form>

        </section>

        <section class="panel panel-usuarios" aria-labelledby="titulo-usuarios">

            <div class="panel-cabecera panel-cabecera-usuarios">

                <div>
                    <p class="panel-etiqueta">Directorio</p>
                    <h2 id="titulo-usuarios">Usuarios registrados</h2>

                    <p id="contador-usuarios" class="contador-usuarios" aria-live="polite">
                        Cargando usuarios...
                    </p>
                </div>

                <button id="boton-recargar" type="button" class="boton-secundario">
                    Recargar
                </button>

            </div>

            <div class="barra-herramientas">
                <div class="campo-busqueda">
                    <label for="buscar">Buscar usuario</label>

                    <div class="buscador-contenedor">
                        <span class="buscador-icono" aria-hidden="true">⌕</span>

                        <input
                            id="buscar"
                            type="search"
                            placeholder="Buscar por nombre o correo"
                            autocomplete="off"
                        >
                    </div>
                </div>
            </div>

            <div
                id="lista-usuarios"
                class="contenedor-tarjetas lista-usuarios"
                aria-live="polite"
                aria-busy="true"
            >
                <div class="estado-listado">
                    Cargando usuarios...
                </div>
            </div>

        </section>

    </main>

    <script src="app.js?v=1.2.2"></script>

</body>
</html>
