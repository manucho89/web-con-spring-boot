<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gestión de Usuarios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="contenedor">

        <header class="cabecera">
            <p class="version">Spring Boot CRUD · v1.1</p>

            <h1>Gestión de Usuarios</h1>

            <p class="subtitulo">
                Frontend conectado con la API de Spring Boot
            </p>
        </header>

        <section class="tarjeta">

            <h2>Nuevo usuario</h2>

            <form id="formulario-usuario">

                <div class="campo">
                    <label for="nombre">Nombre</label>

                    <input
                        id="nombre"
                        name="nombre"
                        type="text"
                        placeholder="Escribe el nombre"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="email">Correo electrónico</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="usuario@ejemplo.com"
                        required
                    >
                </div>

                <button
                    id="boton-guardar"
                    type="submit"
                >
                    Guardar usuario
                </button>

                <p
                    id="mensaje-formulario"
                    class="mensaje-formulario"
                ></p>

            </form>

        </section>

        <section class="tarjeta">

            <div class="cabecera-tabla">

                <div>
                    <h2>Usuarios registrados</h2>

                    <p id="contador-usuarios">
                        Cargando usuarios...
                    </p>
                </div>

                <button
                    id="boton-recargar"
                    type="button"
                >
                    Recargar
                </button>

            </div>


            <div class="campo-busqueda">
                <label for="buscar">Buscar usuario</label>
                <input id="buscar" type="text" placeholder="Buscar por nombre o email">
            </div>

            <div class="contenedor-tabla">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Email</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>

                    <tbody id="tabla-usuarios">

                        <tr>
                            <td
                                colspan="4"
                                class="estado-tabla"
                            >
                                Cargando usuarios...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
